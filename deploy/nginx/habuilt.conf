# Habuilt Nginx Configuration for Hostinger KVM 2 VPS
# Supports both domain routing and direct port 8005 access

server {
    listen 80;
    listen [::]:80;
    listen 8005;
    listen [::]:8005;

    server_name habuilt.ashishgupta.dev habuilt.zoeticoach.com habuilt.com www.habuilt.com 187.127.166.15 _;

    root /var/www/Habuilt/public;
    index index.php index.html;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/Habuilt/public;
    }

    # Logging
    access_log /var/log/nginx/habuilt_access.log;
    error_log  /var/log/nginx/habuilt_error.log;

    # TCP & Buffer Optimization
    tcp_nodelay on;
    tcp_nopush on;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Vite Hashed Assets (1-Year Immutable Caching)
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PWA Service Worker (Never Cache for Instant Protocol Updates)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # PWA Manifest
    location = /manifest.webmanifest {
        expires 1h;
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=3600";
    }

    # Static Assets & Icons
    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Laravel Pretty URLs & Inertia SPA Fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-habuilt.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # Security: Deny access to hidden files and sensitive directories
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* ^/(storage|bootstrap/cache)/ {
        deny all;
    }
}
