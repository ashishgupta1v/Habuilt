# Applied on the Hostinger vhost. Origins are the app, Google fonts used by the
# shell, the QR image used by the install dialog, the Gemini coach call, and
# the Supabase Auth host. No wildcard hosts.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://api.qrserver.com; connect-src 'self' https://eefrpxxcztapatyqokpv.supabase.co wss://eefrpxxcztapatyqokpv.supabase.co https://generativelanguage.googleapis.com; worker-src 'self'; manifest-src 'self'" always;
