name: Build Android APK & Home Screen Widget

on:
  push:
    branches:
      - main
      - HB-AG-01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 🤖 Setup Android SDK Environment & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: ⚡ Build Web Assets (Vite + Dist)
        run: npm run build:vercel
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_URL || 'https://eefrpxxcztapatyqokpv.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' && secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlZnJweHhjenRhcGF0eXFva3B2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NjQ5MDAsImV4cCI6MjA4OTA0MDkwMH0.1pct7C4PK0q9MicvOOM0CW99cc6pJLsV4jKVMoy9b5c' }}

      - name: 🔄 Sync Capacitor Android Platform
        run: npx cap sync android

      - name: 🔑 Grant Execute Permissions for Gradlew
        run: chmod +x android/gradlew

      - name: 🏗️ Compile Universal Android APKs (Release & Debug)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace
          mkdir -p output_apks
          # Locate Release APK
          if [ -f "app/build/outputs/apk/release/habuilt-release.apk" ]; then
            cp app/build/outputs/apk/release/habuilt-release.apk output_apks/habuilt.apk
            cp app/build/outputs/apk/release/habuilt-release.apk output_apks/habuilt-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk output_apks/habuilt.apk
            cp app/build/outputs/apk/release/app-release.apk output_apks/habuilt-release.apk
          fi
          # Locate Debug APK
          if [ -f "app/build/outputs/apk/debug/habuilt-debug.apk" ]; then
            cp app/build/outputs/apk/debug/habuilt-debug.apk output_apks/habuilt-debug.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apks/habuilt-debug.apk
          fi
          echo "Generated APK packages:"
          ls -lh output_apks/

      - name: 🚀 Upload APK Artifacts (Downloadable in GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Habuilt-APK
          path: android/output_apks/*.apk
          retention-days: 30

      - name: 🏷️ Publish Rolling Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/HB-AG-01'
        with:
          tag_name: latest-build
          name: "Habuilt Android APK (with Due Now Home Screen Widget)"
          body: |
            ## 📱 Habuilt Android Native APK (Universal Compatibility)

            ### ✨ Features in this build:
            - **⚡ Live Due Now Widget**: 4x2 / 4x1 home screen widget displaying active routine task, time slot, and streak.
            - **✓ 1-Tap [Mark Done]**: Complete tasks directly from your home screen with haptic feedback without opening the app.
            - **🔄 Supabase Cloud Sync**: Instant background persistence of completed habits.
            - **🛡️ Universal Compatibility**: Compiled for Android API 34 with dual v1 (JAR) & v2 (APK) cryptographic signatures for 100% parse & install compatibility across Android 7 through Android 15.
            - **🚀 Fast Local Cache**: 0ms latency widget updates.

            ### 📲 How to Install:
            1. Download **`habuilt.apk`** below directly onto your Android phone.
            2. Tap to Install (*allow "Install from Unknown Sources" or "Install Unknown Apps" in your browser/file manager if prompted*).
            3. If updating from an earlier build, you may tap **Update**; if an older incompatible debug build was previously installed, uninstall the old app first.
            4. Long-press on your phone's home screen wallpaper → **Widgets** → **Habuilt** → Place the **Due Now** widget!
          files: |
            android/output_apks/habuilt.apk
            android/output_apks/habuilt-release.apk
            android/output_apks/habuilt-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

